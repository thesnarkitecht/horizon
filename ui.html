<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>horizon</title>
<style>
:root { --bg: #fbfbf8; --fg: #111; --dim: #6a6a6a; --rule: #d6d6d0; --acc: #0000f2; --ok: #137a2e; --bad: #c4231b; --sel: #ececE6; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0b0b0b; --fg: #d6d6d6; --dim: #8a8a8a; --rule: #2a2a2a; --acc: #8c8cff; --ok: #4cc26a; --bad: #ff6b60; --sel: #1a1a1a; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.6 ui-monospace, "SF Mono", Menlo, monospace; }
button, input { font: inherit; color: inherit; }
main { max-width: 1100px; margin: 0 auto; padding: 18px 24px 60px; }
.dim { color: var(--dim); }
.acc { color: var(--acc); } .ok { color: var(--ok); } .bad { color: var(--bad); }
hr { border: 0; border-top: 1px dashed var(--rule); margin: 14px 0; }
.btn { background: none; border: 0; padding: 0; cursor: pointer; color: var(--acc); }
.btn::before { content: "["; color: var(--dim); } .btn::after { content: "]"; color: var(--dim); }
.btn:hover { text-decoration: underline; }
.btn:focus-visible, .row:focus-visible, .grid button:focus-visible { outline: 1px solid var(--acc); outline-offset: 2px; }
input { background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 2px 0; outline: none; min-width: 0; }
input:focus { border-bottom-color: var(--acc); }

.top { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.top b { font-weight: 700; letter-spacing: .04em; }

.ask { display: flex; gap: 10px; align-items: baseline; }
.ask > span { color: var(--acc); font-weight: 700; }
.ask #goal { flex: 1; font-size: 15px; border: 0; }
.opts { display: flex; gap: 22px; flex-wrap: wrap; align-items: baseline; margin-top: 6px; padding-left: 20px; }
.opts label { display: flex; gap: 8px; }
.opts #agents, .opts #budget { width: 60px; } .opts #repo { width: 280px; max-width: 60vw; }

.row { display: grid; grid-template-columns: 36px 1fr auto; gap: 14px; padding: 3px 6px; margin: 0 -6px; cursor: pointer; white-space: nowrap; }
.row:hover, .row.sel { background: var(--sel); }
.row .t { overflow: hidden; text-overflow: ellipsis; }
.bar { letter-spacing: -.05em; }

.focus h1 { font-size: 13px; font-weight: 700; margin: 0 0 4px; }
.ms { list-style: none; margin: 6px 0 0; padding: 0; }
.ms li { display: flex; gap: 10px; }
.ms li > span:first-child { flex-shrink: 0; white-space: nowrap; }
.ms li.now { font-weight: 700; }
.grid { display: flex; flex-wrap: wrap; gap: 0; margin-top: 6px; line-height: 1; max-height: 240px; overflow: auto; }
.grid button { background: none; border: 0; padding: 1px; width: 13px; height: 15px; cursor: pointer; color: var(--dim); font-size: 12px; line-height: 1; }
.grid button.running { color: var(--acc); } .grid button.done { color: var(--ok); } .grid button.bad { color: var(--bad); }
.grid button.queued { color: var(--rule); } .grid button.sel { background: var(--fg); color: var(--bg); }
pre { margin: 6px 0 0; max-height: 50vh; overflow: auto; white-space: pre-wrap; word-break: break-word; border-left: 1px dashed var(--rule); padding-left: 12px; }
.a2 { color: var(--dim); } .a36 { color: var(--acc); } .a35 { color: #b26a00; }

dialog { background: var(--bg); color: var(--fg); border: 1px solid var(--rule); padding: 18px 22px; width: min(720px, calc(100vw - 24px)); }
dialog::backdrop { background: rgb(0 0 0 / .4); }
dialog .f { display: flex; gap: 10px; align-items: baseline; margin: 6px 0; flex-wrap: wrap; }
dialog .f > span:first-child { min-width: 90px; color: var(--dim); white-space: nowrap; }
dialog .f input { flex: 1; }
dialog pre { max-height: 140px; }
@media (max-width: 700px) { main { padding: 14px 14px 40px; } .row { grid-template-columns: 28px 1fr; } .row .r { grid-column: 2; } .bar { display: none; } }
</style>
</head>
<body>
<main>
  <div class="top"><span><b>horizon</b> <span class="dim">· research lab</span></span>
    <span><span id="status" class="dim">engine …</span> <button class="btn" id="setBtn" type="button">settings</button></span></div>
  <hr>
  <form id="new">
    <label class="ask"><span>&gt;</span><input id="goal" placeholder="what should the lab find out?" aria-label="research goal" autocomplete="off"></label>
    <div class="opts dim">
      <label>agents <input id="agents" type="number" min="1" value="16"></label>
      <label>budget <input id="budget" value="10B" aria-label="token budget"></label>
      <label>repo <input id="repo" placeholder="optional git url"></label>
      <button class="btn">start ↵</button>
    </div>
  </form>
  <hr>
  <div id="list"></div>
  <div id="focus" class="focus" hidden></div>
</main>

<dialog id="set">
  <div class="top"><b>settings</b><button class="btn" type="button" id="closeSet">close</button></div>
  <hr>
  <div class="dim">model source</div>
  <div class="f"><span>use</span><label><input type="radio" name="src" value="local" checked> local engine</label><label><input type="radio" name="src" value="api"> api key</label></div>
  <div id="apiFields" hidden>
    <div class="f"><span>url</span><input id="url" placeholder="https://openrouter.ai/api/v1/chat/completions"></div>
    <div class="f"><span>key</span><input id="key" type="password" placeholder="stored on this Mac only" autocomplete="off"></div>
    <div class="f"><span>model</span><input id="model" placeholder="model id"></div>
  </div>
  <div class="f"><span></span><button class="btn" type="button" id="saveSrc">save</button><span id="srcMsg" class="dim"></span></div>
  <hr>
  <div class="dim">local engine</div>
  <div class="f"><span>base model</span><input id="smodel" placeholder="mlx-community/Qwen3.8-27B-8bit"><button class="btn" id="serve" type="button">start</button><button class="btn" id="halt" type="button">stop</button></div>
  <div class="f"><span>pair macs</span><input id="hosts" placeholder="optional: studio1.local,studio2.local"><button class="btn" id="pair" type="button">pair</button></div>
  <div class="f"><span>gpu</span><span id="gpuline" class="dim" style="white-space:pre-line"></span></div>
  <hr>
  <div class="dim">adapters the agents trained <span id="active"></span></div>
  <div id="adapters"></div>
  <hr>
  <pre id="elog" class="dim"></pre>
</dialog>

<script>
const H = {"X-Horizon": "1", "Content-Type": "application/json"};
const $ = id => document.getElementById(id);
const get = p => fetch(p).then(r => r.json());
const post = (p, b) => fetch(p, {method: "POST", headers: H, body: JSON.stringify(b || {})});
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
const ansi = s => esc(s).replace(/\x1b\[(\d+)m/g, (_, n) => n === "0" ? "</span>" : `<span class="a${n}">`);
const fmt = n => n >= 1e9 ? (n / 1e9).toFixed(1) + "B" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "k" : String(Math.round(n));
const parseN = s => { const m = String(s).trim().match(/^([\d.]+)\s*([kmb]?)$/i); return m ? m[1] * {"": 1, k: 1e3, m: 1e6, b: 1e9}[m[2].toLowerCase()] : NaN; };
const pct = p => String(Math.round(p * 100)).padStart(3, " ") + "%";
const bar = (p, w) => "█".repeat(Math.round(p * w)) + "░".repeat(w - Math.round(p * w));
const kind = s => s === "running" ? "running" : s === "done" ? "done" : s === "queued" ? "queued" : /kill|fail|error|crash/.test(s) ? "bad" : "";
const word = x => x.status === "running" ? (x.id[0] === "s" ? `${x.running} agents` : "working")
  : x.status === "done" ? "finished" : x.status.startsWith("killed") ? "killed by reviewer" : x.status;

let sel = null, agent = null, off = -1, last = {}, lastT = 0, tps = 0;

async function tick() {
  const [swarms, runs] = await Promise.all([get("/projects"), get("/runs")]);
  const items = [...swarms, ...runs].sort((a, b) => (b.created || 0) - (a.created || 0)), now = Date.now() / 1000;
  if (lastT) tps = items.reduce((a, x) => a + (last[x.id] != null ? Math.max(0, x.tokens - last[x.id]) : 0), 0) / (now - lastT);
  last = Object.fromEntries(items.map(x => [x.id, x.tokens])); lastT = now;
  $("list").innerHTML = items.map((x, i) => `<div class="row ${x.id === sel ? "sel" : ""}" data-id="${x.id}" tabindex="0" role="button">
      <span class="dim">#${items.length - i}</span><span class="t">${esc(x.goal || x.hypothesis)}</span>
      <span class="r"><span class="bar ${kind(x.status) === "done" ? "ok" : "acc"}">${bar(x.progress, 20)}</span> ${pct(x.progress)} <span class="dim">${esc(word(x))}</span></span></div>`).join("")
    || `<div class="dim">no research yet. type a question above and press enter.</div>`;
  const x = items.find(x => x.id === sel);
  if (x) await focus(x);
}

async function focus(x) {
  const f = $("focus"), swarm = x.id[0] === "s";
  if (f.dataset.id !== x.id) {
    f.dataset.id = x.id; f.hidden = false; off = -1; agent = null;
    f.innerHTML = `<hr><h1 id="ft"></h1><div id="fs"></div>
      <hr><div class="dim">milestones</div><ul class="ms" id="fms"></ul>
      ${swarm ? `<hr><div class="dim" id="gs"></div><div class="grid" id="grid" aria-label="agents"></div>` : ""}
      <hr><div class="dim" id="lh">${swarm ? "pick an agent above to follow its work" : "work"}</div><pre id="log" tabindex="0"></pre>`;
    if (swarm) $("grid").onclick = e => { const b = e.target.closest("button"); if (b) { agent = b.dataset.id; off = -1; $("log").innerHTML = ""; tick(); } };
  }
  const done = x.milestones.filter(m => m.done).length;
  $("ft").textContent = x.goal || x.hypothesis;
  $("fs").innerHTML = `<span class="acc bar">${bar(x.progress, 40)}</span> ${pct(x.progress)}  <span class="dim">${done}/${x.milestones.length || "?"} milestones · ${esc(word(x))} · ${fmt(x.tokens)}/${fmt(x.budget)} tok</span>  `
    + (x.status === "running" ? `<button class="btn" type="button" data-act="stop">stop</button>`
       : !x.status.startsWith("killed") && x.status !== "queued" ? `<button class="btn" type="button" data-act="continue">continue</button>` : "");
  $("fs").onclick = e => { const a = e.target.dataset.act; if (a) post(`/${swarm ? "projects" : "runs"}/${x.id}/${a}`); };
  const cur = x.milestones.findIndex(m => !m.done);
  $("fms").innerHTML = x.milestones.map((m, i) => `<li class="${i === cur ? "now" : m.done ? "" : "dim"}"><span class="${m.done ? "ok" : i === cur ? "acc" : ""}">${m.done ? "[x]" : i === cur ? "[>]" : "[ ]"}</span><span>${esc(m.text)}</span></li>`).join("")
    || `<li class="dim">the agents are drafting milestones…</li>`;
  if (swarm) {
    const kids = await get(`/projects/${x.id}/runs`);
    $("gs").textContent = `agents  ${x.running} running · ${x.finished} finished · ${x.done} succeeded`;
    // shortcut: draws the newest 4000 agents as DOM cells, switch to <canvas> if swarms grow past that
    $("grid").innerHTML = kids.slice(0, 4000).map(r => `<button type="button" class="${kind(r.status)} ${r.id === agent ? "sel" : ""}" data-id="${r.id}" title="${esc(r.hypothesis)} · ${esc(r.status)}" aria-label="agent ${r.id}, ${esc(r.status)}">■</button>`).join("");
    const a = kids.find(r => r.id === agent);
    if (a) $("lh").textContent = `agent ${a.id} · ${a.status} · ${a.steps} steps · ${a.hypothesis}`;
  }
  const id = swarm ? agent : x.id;
  if (id) await pullLog(id);
}

async function pullLog(id) {
  const r = await fetch(`/runs/${id}/log?from=${off}`);
  if (!r.ok) return;
  const t = await r.text(), log = $("log"), stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 40;
  if (off < 0) log.innerHTML = "";
  off = +r.headers.get("X-Next");
  if (t) { log.insertAdjacentHTML("beforeend", ansi(t)); if (stick) log.scrollTop = log.scrollHeight; }
}

async function engine() {
  const [s, g] = await Promise.all([get("/status"), get("/gpu")]);
  const act = s.adapters.find(a => a.active);
  const src = s.source === "local" ? `local ${(s.models[0] || s.base_model).split("/").pop()}${act ? " +" + act.name : ""}` : `api ${s.model}`;
  const gpus = g.filter(m => !m.error).map(m => `${m.mhz}MHz ${Math.round(m.active * 100)}%`).join(" / ");
  $("status").innerHTML = `<span class="${s.up || s.source !== "local" ? "ok" : "bad"}">●</span> ${esc(src)}`
    + `${s.hosts ? ` │ ${s.hosts.hosts.length} macs` : ""}${gpus ? ` │ gpu ${esc(gpus)}` : ""} │ ${tps >= 10 ? Math.round(tps) : tps.toFixed(1)} tok/s`;
  if (!$("set").open) return;
  $("gpuline").textContent = g.map(m => m.error ? `${m.host}: ${m.error}` : `${m.host} ${m.mhz} MHz · ${Math.round(m.active * 100)}% busy · ${Math.round(m.watts)} W · mem ${Math.round(m.ram * 100)}%`).join("\n") || "—";
  $("active").textContent = act ? `· agents run on ${act.name}` : "· agents run on the base model";
  $("adapters").innerHTML = s.adapters.map(a => `<div class="f"><span>${esc(a.name)}</span><span class="dim">${esc(a.status)} · loss ${a.base_loss ?? "?"} → ${a.test_loss ?? "?"} · by ${esc(a.by)}</span>
      ${a.active ? `<span class="ok">active</span> <button class="btn" type="button" data-adopt="none">roll back</button>` : a.status === "trained" ? `<button class="btn" type="button" data-adopt="${esc(a.name)}">adopt</button>` : ""}</div>`).join("")
    || `<div class="dim">none yet. agents train adapters with the finetune tool.</div>`;
  $("elog").textContent = (s.serve_log + s.setup_log).slice(-3000) || "no engine output yet.";
}

async function openSettings() {
  const s = await get("/status");
  document.querySelector(`input[name=src][value=${s.source === "local" ? "local" : "api"}]`).checked = true;
  $("apiFields").hidden = s.source === "local";
  if (s.source !== "local") { $("url").value = s.source; $("model").value = s.model; $("key").placeholder = s.has_key ? "•••••••• saved (type to replace)" : "stored on this Mac only"; }
  $("smodel").value = s.base_model;
  $("set").showModal(); engine();
}

$("list").onclick = e => { const r = e.target.closest(".row"); if (r) { sel = r.dataset.id; tick(); } };
$("list").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { const r = e.target.closest(".row"); if (r) { e.preventDefault(); sel = r.dataset.id; tick(); } } };
$("new").onsubmit = async e => {
  e.preventDefault();
  const hypothesis = $("goal").value.trim(), budget = parseN($("budget").value);
  if (!hypothesis) return $("goal").focus();
  if (!budget) return $("budget").focus();
  const r = await post("/runs", {hypothesis, agents: +$("agents").value || 1, budget, repo: $("repo").value});
  if (r.ok) { $("goal").value = ""; sel = (await r.json()).id; tick(); }
};
$("setBtn").onclick = openSettings;
$("closeSet").onclick = () => $("set").close();
document.querySelectorAll("input[name=src]").forEach(r => r.onchange = () => $("apiFields").hidden = r.value === "local" && r.checked);
$("saveSrc").onclick = async () => {
  const api = document.querySelector("input[name=src]:checked").value === "api";
  const body = api ? {url: $("url").value.trim(), model: $("model").value.trim(), ...($("key").value ? {key: $("key").value} : {})} : {url: "http://127.0.0.1:8080/v1/chat/completions", model: "default_model"};
  const r = await post("/config", body);
  $("srcMsg").textContent = r.ok ? "saved · new requests use it" : "url must start with http:// or https://";
  $("key").value = "";
};
$("serve").onclick = () => post("/serve", {model: $("smodel").value});
$("halt").onclick = () => post("/serve/stop");
$("pair").onclick = async () => { if (!(await post("/setup", {hosts: $("hosts").value})).ok) alert("enter at least two hostnames, separated by commas"); };
$("adapters").onclick = async e => { const n = e.target.dataset.adopt; if (n) { const r = await post(`/adapters/${n}/adopt`); if (!r.ok) alert(await r.text()); engine(); } };
const loop = (f, ms) => { const go = () => f().catch(() => {}).finally(() => setTimeout(go, ms)); go(); };
loop(tick, 2000); loop(engine, 3000);
$("goal").focus();
</script>
</body>
</html>
