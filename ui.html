<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&display=swap">
<style>
:root {
  --paper: #ffffff; --ink: #0a0a0a; --mute: #63636b; --rule: #e4e4e4; --blue: #0000f2; --link: #0000f2; --on-blue: #ffffff;
  --display: "Helvetica Neue", "Archivo Narrow", "Arial Narrow", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #050508; --ink: #f4f4f4; --mute: #9a9aa4; --rule: #232329; --blue: #2b2bff; --link: #8c8cff; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--mono); }
button, input { font: inherit; color: inherit; }
.display { font-family: var(--display); font-stretch: condensed; font-weight: 700; letter-spacing: -.01em; line-height: .95; text-transform: uppercase; }
.label { font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--mute); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 32px; }

nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 0; }
nav .brand { font-size: 26px; }
nav .eng { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
.link { background: none; border: 0; padding: 4px 0; cursor: pointer; font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink); border-bottom: 1px solid currentColor; }
.link:focus-visible, .go:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #d92d20; margin-right: 6px; vertical-align: 1px; }
.dot.up { background: #16a34a; }

.hero { background: var(--blue); color: var(--on-blue); }
.hero .wrap { padding-top: 64px; padding-bottom: 40px; }
.hero h1 { margin: 0 0 28px; font-size: clamp(44px, 7vw, 96px); }
.ask { display: block; width: 100%; background: none; border: 0; border-bottom: 2px solid rgb(255 255 255 / .5); color: var(--on-blue);
       font: 500 clamp(22px, 2.6vw, 32px)/1.3 var(--mono); padding: 8px 0 12px; outline: none; }
.ask::placeholder { color: rgb(255 255 255 / .8); }
.ask:focus { border-bottom-color: var(--on-blue); }
.controls { display: flex; align-items: end; gap: 28px; margin-top: 22px; flex-wrap: wrap; }
.controls label { display: grid; gap: 4px; font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: rgb(255 255 255 / .88); }
.controls input { background: none; border: 0; border-bottom: 1px solid rgb(255 255 255 / .5); color: var(--on-blue); padding: 4px 0; width: 120px; outline: none; }
.controls input:focus { border-bottom-color: var(--on-blue); }
.controls .repo input { width: 300px; max-width: 70vw; }
.go { margin-left: auto; background: var(--on-blue); color: var(--blue); border: 0; padding: 14px 26px; font: 700 15px var(--mono); text-transform: uppercase; letter-spacing: .06em; cursor: pointer; }

section.list { padding: 48px 0 24px; }
.row { display: grid; grid-template-columns: 64px 1fr 140px; gap: 24px; align-items: baseline; padding: 22px 0; border-top: 1px solid var(--rule); cursor: pointer; }
.row:last-child { border-bottom: 1px solid var(--rule); }
.row:hover .title, .row.sel .title { color: var(--link); }
.row .n { color: var(--link); font: 500 14px var(--mono); }
.row .title { font-size: clamp(26px, 3vw, 38px); }
.row .meta { margin-top: 8px; }
.row .pct { font-size: clamp(36px, 4vw, 54px); text-align: right; }
.row .pct small { font-size: .5em; }
.none { padding: 40px 0; color: var(--mute); }

section.focus { padding: 24px 0 80px; }
.focus-grid { display: grid; grid-template-columns: 320px 1fr; gap: 56px; align-items: start; border-top: 2px solid var(--ink); padding-top: 36px; }
.ring { display: block; width: 100%; max-width: 300px; height: auto; }
.ring circle { fill: none; stroke-width: 10; }
.ring .tr { stroke: var(--rule); }
.ring .bar { stroke: var(--blue); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1); }
.ring text { fill: var(--ink); font-family: var(--display); font-stretch: condensed; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
@media (prefers-reduced-motion: reduce) { .ring .bar { transition: none; } }
.focus h2 { margin: 0 0 12px; font-size: clamp(28px, 3.2vw, 44px); }
.actions { display: flex; gap: 22px; margin: 18px 0 32px; }
ol.ms { list-style: none; margin: 0; padding: 0; counter-reset: ms; }
ol.ms li { counter-increment: ms; display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: baseline; padding: 14px 0; border-top: 1px solid var(--rule); color: var(--mute); }
ol.ms li::before { content: "#" counter(ms); font: 500 13px var(--mono); }
ol.ms li.done { color: var(--ink); }
ol.ms li.done::before, ol.ms li.now::before { color: var(--link); }
ol.ms li.now { color: var(--ink); font-weight: 700; }
ol.ms li .tag { font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: .08em; }
ol.ms li.done .tag { color: var(--link); }
ol.ms li.now .tag { background: var(--blue); color: var(--on-blue); padding: 2px 8px; }
.waiting { color: var(--mute); padding: 14px 0; border-top: 1px solid var(--rule); }
details.work { margin-top: 36px; }
details.work summary { cursor: pointer; width: max-content; }
details.work pre { margin: 16px 0 0; max-height: 46vh; overflow: auto; padding: 18px; background: rgb(127 127 127 / .07); font: 12.5px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; }
.a2 { color: var(--mute); } .a36 { color: var(--link); font-weight: 600; } .a35 { color: #b26a00; }

dialog { border: 2px solid var(--ink); border-radius: 0; background: var(--paper); color: var(--ink); padding: 28px; width: min(600px, calc(100vw - 32px)); }
dialog::backdrop { background: rgb(0 0 242 / .25); }
dialog h3 { margin: 0 0 20px; font-size: 34px; }
dialog .field { display: flex; gap: 16px; align-items: end; margin-bottom: 16px; }
dialog input { flex: 1; min-width: 0; background: none; border: 0; border-bottom: 1px solid var(--ink); padding: 8px 0; outline: none; }
dialog input:focus { border-bottom: 2px solid var(--blue); }
dialog pre { height: 160px; overflow: auto; background: rgb(127 127 127 / .07); padding: 12px; font-size: 12px; white-space: pre-wrap; margin: 8px 0 18px; }
.solid { background: var(--blue); color: #fff; border: 0; padding: 10px 18px; font: 700 13px var(--mono); text-transform: uppercase; letter-spacing: .06em; cursor: pointer; }

@media (max-width: 820px) {
  .wrap { padding: 0 16px; }
  #engine { display: none; }
  .row { grid-template-columns: 40px 1fr; } .row .pct { grid-column: 2; text-align: left; }
  .focus-grid { grid-template-columns: 1fr; gap: 28px; } .ring { max-width: 220px; }
  .go { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>
<div class="wrap"><nav>
  <div class="display brand">Horizon</div>
  <div class="eng"><span class="label" id="engine"><span class="dot"></span>engine down</span><button class="link" id="engineBtn" type="button">Engine</button></div>
</nav></div>

<header class="hero"><div class="wrap">
  <h1 class="display">Research that<br>runs for months.</h1>
  <form id="new">
    <input class="ask" id="goal" placeholder="What should the lab find out?" aria-label="research goal" autocomplete="off">
    <div class="controls">
      <label>Agents<input id="agents" type="number" min="1" value="16"></label>
      <label>Budget<input id="budget" value="10B" aria-label="token budget"></label>
      <label class="repo">Git repo · optional<input id="repo" placeholder="git@github.com:you/repo.git"></label>
      <button class="go">Start research →</button>
    </div>
  </form>
</div></header>

<main class="wrap">
  <section class="list" aria-label="research"><div class="label" style="margin-bottom:14px">Research</div><div id="list"></div></section>
  <section class="focus" id="focus" hidden></section>
</main>

<dialog id="engineDlg">
  <h3 class="display">Engine</h3>
  <div class="field"><input id="smodel" placeholder="Model · default Ornith-1.5-397B 4-bit" aria-label="model"><button class="solid" id="serve" type="button">Start</button><button class="link" id="halt" type="button">Stop</button></div>
  <div class="field"><input id="hosts" placeholder="studio1.local,studio2.local" aria-label="Macs to pair"><button class="link" id="pair" type="button">Pair Macs</button></div>
  <div class="label" id="gpuline"></div>
  <pre id="elog"></pre>
  <button class="link" type="button" id="closeDlg">Close</button>
</dialog>

<script>
const H = {"X-Horizon": "1", "Content-Type": "application/json"};
const $ = id => document.getElementById(id);
const get = p => fetch(p).then(r => r.json());
const post = (p, b) => fetch(p, {method: "POST", headers: H, body: JSON.stringify(b || {})});
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
const ansi = s => esc(s).replace(/\x1b\[(\d+)m/g, (_, n) => n === "0" ? "</span>" : `<span class="a${n}">`);
const fmt = n => n >= 1e9 ? (n / 1e9).toFixed(1) + "B" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "k" : String(Math.round(n));
const parseN = s => { const m = String(s).trim().match(/^([\d.]+)\s*([kmb]?)$/i); return m ? m[1] * {"": 1, k: 1e3, m: 1e6, b: 1e9}[m[2].toLowerCase()] : NaN; };
const pct = p => Math.round(p * 100);
const word = x => x.status === "running" ? (x.id[0] === "s" ? `${x.running} agents working` : "working")
  : x.status === "done" ? "finished" : x.status.startsWith("killed") ? "stopped by reviewer" : x.status;

let sel = null, off = -1, last = {}, lastT = 0, tps = 0, items = [];

function ring(p) {
  const r = 44, c = 2 * Math.PI * r;
  return `<svg class="ring" viewBox="0 0 100 100" role="img" aria-label="${pct(p)} percent of milestones done">
    <circle class="tr" cx="50" cy="50" r="${r}"/><circle class="bar" cx="50" cy="50" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - Math.min(1, p))}"/>
    <text x="50" y="47" font-size="30">${pct(p)}%</text><text x="50" y="68" font-size="7" style="fill:var(--mute);font-family:var(--mono);font-stretch:normal;font-weight:500;letter-spacing:.08em">HOW CLOSE</text></svg>`;
}

async function tick() {
  const [swarms, runs] = await Promise.all([get("/projects"), get("/runs")]);
  items = [...swarms, ...runs].sort((a, b) => (b.created || 0) - (a.created || 0));
  const now = Date.now() / 1000;
  if (lastT) tps = items.reduce((a, x) => a + (last[x.id] != null ? Math.max(0, x.tokens - last[x.id]) : 0), 0) / (now - lastT);
  last = Object.fromEntries(items.map(x => [x.id, x.tokens])); lastT = now;

  $("list").innerHTML = items.map((x, i) => `<div class="row ${x.id === sel ? "sel" : ""}" data-id="${x.id}" tabindex="0" role="button">
      <div class="n">#${items.length - i}</div>
      <div><div class="display title">${esc(x.goal || x.hypothesis)}</div>
        <div class="label meta">${esc(word(x))} · ${x.milestones.filter(m => m.done).length}/${x.milestones.length || "—"} milestones · ${fmt(x.tokens)} tokens</div></div>
      <div class="display pct">${pct(x.progress)}<small>%</small></div></div>`).join("")
    || `<div class="none">Nothing yet. Ask the lab something above.</div>`;

  const x = items.find(x => x.id === sel);
  if (x) await focus(x);
}

async function focus(x) {
  const f = $("focus"), isSwarm = x.id[0] === "s";
  if (f.dataset.id !== x.id) {
    f.dataset.id = x.id; f.hidden = false; off = -1;
    f.innerHTML = `<div class="focus-grid"><div id="fring"></div><div>
      <div class="label" id="fsub"></div><h2 class="display" id="ftitle"></h2>
      <div class="actions"><button class="link" id="fstop" type="button">Stop</button><button class="link" id="fcont" type="button">Continue</button></div>
      <div class="label" style="margin-bottom:6px">Milestones</div><ol class="ms" id="fms"></ol>
      ${isSwarm ? "" : `<details class="work" id="fwork"><summary class="link">Show work</summary><pre id="log" tabindex="0"></pre></details>`}
    </div></div>`;
    $("fstop").onclick = () => post(`/${isSwarm ? "projects" : "runs"}/${x.id}/stop`);
    $("fcont").onclick = () => post(`/${isSwarm ? "projects" : "runs"}/${x.id}/continue`);
    f.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start"});
  }
  $("fring").innerHTML = ring(x.progress);
  $("ftitle").textContent = x.goal || x.hypothesis;
  $("fsub").textContent = `${word(x)} · ${fmt(x.tokens)} of ${fmt(x.budget)} tokens`;
  $("fstop").hidden = x.status !== "running";
  $("fcont").hidden = x.status === "running" || x.status === "queued" || x.status.startsWith("killed");
  const now = x.milestones.findIndex(m => !m.done);
  $("fms").innerHTML = x.milestones.map((m, i) => `<li class="${m.done ? "done" : i === now ? "now" : ""}"><span>${esc(m.text)}</span>
      <span class="tag">${m.done ? "✓ done" : i === now ? "now" : ""}</span></li>`).join("")
    || `<li class="waiting" style="display:block">The agents are drafting the milestones.</li>`;
  if (!isSwarm && $("fwork").open) await pullLog(x.id);
}

async function pullLog(id) {
  const r = await fetch(`/runs/${id}/log?from=${off}`);
  if (!r.ok) return;
  const t = await r.text(), log = $("log"), stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 40;
  if (off < 0) log.innerHTML = "";
  off = +r.headers.get("X-Next");
  if (t) { log.insertAdjacentHTML("beforeend", ansi(t)); if (stick) log.scrollTop = log.scrollHeight; }
}

async function engine() {
  const [s, g] = await Promise.all([get("/status"), get("/gpu")]);
  const ghz = g.filter(m => !m.error).map(m => `${m.mhz} MHz`).join(" / ");
  $("engine").innerHTML = `<span class="dot ${s.up ? "up" : ""}"></span>${s.up ? "engine on" : "engine down"}`
    + `${s.hosts ? ` · ${s.hosts.hosts.length} Macs` : ""}${ghz ? ` · GPU ${ghz}` : ""} · ${tps >= 10 ? Math.round(tps) : tps.toFixed(1)} tok/s`;
  $("gpuline").textContent = g.map(m => m.error ? `${m.host}: ${m.error}` : `${m.host}: ${m.mhz} MHz · ${pct(m.active)}% busy · ${Math.round(m.watts)} W · mem ${pct(m.ram)}%`).join("   ");
  $("elog").textContent = (s.serve_log + s.setup_log).slice(-3000) || "No engine output yet.";
}

const open = el => { if (el) { sel = el.dataset.id; tick(); } };
$("list").onclick = e => open(e.target.closest(".row"));
$("list").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(e.target.closest(".row")); } };
$("new").onsubmit = async e => {
  e.preventDefault();
  const hypothesis = $("goal").value.trim(), budget = parseN($("budget").value);
  if (!hypothesis) return $("goal").focus();
  if (!budget) return $("budget").focus();
  const r = await post("/runs", {hypothesis, agents: +$("agents").value || 1, budget, repo: $("repo").value});
  if (r.ok) { $("goal").value = ""; sel = (await r.json()).id; tick(); }
};
$("engineBtn").onclick = () => $("engineDlg").showModal();
$("closeDlg").onclick = () => $("engineDlg").close();
$("serve").onclick = () => post("/serve", {model: $("smodel").value});
$("halt").onclick = () => post("/serve/stop");
$("pair").onclick = async () => { if (!(await post("/setup", {hosts: $("hosts").value})).ok) alert("Enter at least two hostnames, separated by commas."); };
const loop = (f, ms) => { const go = () => f().catch(() => {}).finally(() => setTimeout(go, ms)); go(); };
loop(tick, 2000); loop(engine, 3000);
</script>
</body>
</html>
